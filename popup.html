<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LMS Redesign Settings</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body class="is-loading">
  <header class="header" id="popupHeader">
    <div class="header-glow"></div>
    <h1>Bahria LMS Redesign</h1>
    <p>Your learning portal, drawn in ink</p>
  </header>

  <section class="section">
    <h2 class="section-title">Appearance</h2>

    <div class="toggle-row">
      <div class="toggle-copy">
        <span class="toggle-label" id="schemeLabel">Colour Mode</span>
        <p class="toggle-desc" id="schemeDesc">Auto follows your system</p>
      </div>
      <div class="segmented" id="schemeControl" role="radiogroup" aria-labelledby="schemeLabel">
        <button type="button" role="radio" data-scheme="light">Light</button>
        <button type="button" role="radio" data-scheme="dark">Dark</button>
        <button type="button" role="radio" data-scheme="auto">Auto</button>
      </div>
    </div>

    <div class="toggle-row toggle-row--spaced">
      <div class="toggle-copy">
        <label class="toggle-label" for="animeToggle">Anime Style</label>
        <p class="toggle-desc">Inked panels, glass and wallpapers</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="animeToggle">
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
  </section>

  <div class="divider"></div>

  <section class="section" id="wallpaperSection">
    <h2 class="section-title" id="wallpaperTitle">Wallpaper</h2>

    <!-- None, the built-in artwork from LmsSettings.WALLPAPERS, then the
         upload slot. Built by popup.js. -->
    <div class="wallpaper-grid" id="wallpaperGrid" role="radiogroup" aria-labelledby="wallpaperTitle"></div>

    <input type="file" id="wallpaperInput" class="visually-hidden" tabindex="-1" aria-hidden="true">

    <div class="wallpaper-controls">
      <button type="button" class="mini-btn mini-btn--primary" id="wallpaperUpload">Upload image</button>
      <label class="mini-select">
        <span class="visually-hidden">Fit</span>
        <select id="wallpaperFit" title="How the image fills the page">
          <option value="cover">Fill</option>
          <option value="contain">Fit</option>
        </select>
      </label>
      <label class="mini-select">
        <span class="visually-hidden">Position</span>
        <select id="wallpaperPos" title="Which part of the image stays in view">
          <option value="center">Centre</option>
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </label>
    </div>

    <p class="subsection-desc" id="wallpaperNote"></p>
    <p class="subsection-desc" id="wallpaperHint" hidden>Turn on Anime Style to show wallpapers.</p>
  </section>

  <div class="divider"></div>

  <section class="section">
    <h2 class="section-title" id="themeTitle">Theme</h2>
    <!-- Populated from the THEMES table in popup.js so the swatch colours and
         the theme list can never drift apart. -->
    <div class="theme-grid" id="themeGrid" role="radiogroup" aria-labelledby="themeTitle"></div>
  </section>

  <p class="status" id="status" role="status" hidden></p>

  <footer class="popup-footer">
    <span class="shortcut-hint" id="shortcutHint"></span>
    <button type="button" class="link-btn" id="openSettings">Backup &amp; settings</button>
  </footer>

  <script src="js/settings.js"></script>
  <script src="js/wallpaper-upload.js"></script>
  <script src="popup.js"></script>
</body>
</html>
